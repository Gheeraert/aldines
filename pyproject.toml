[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-aldines"
version = "0.1.0"
description = "Atelier local de publication statique de l’Augustinus"
requires-python = ">=3.11"
dependencies = ["lxml>=5,<7"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
aldines = "aldines.__main__:main"

[tool.setuptools.packages.find]
include = ["aldines*"]

[tool.setuptools.package-data]
aldines = ["assets/*.css", "assets/*.js", "assets/frontispice-1641.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
